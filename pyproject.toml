[project]
name = "DLPDetection"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
victim = [
    "requests",
]

attacker = [
    "scapy",
]


gateway = [
    "mitmproxy",
    "scapy",
]

dev = [
    { include-group = "gateway" },
    { include-group = "victim" },
    { include-group = "attacker" },
    "pytest",
]